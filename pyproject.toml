[project]
name = "mealie-llm-server"
version = "0.1.0"
description = "OpenAI-compatible API gateway for Mealie with local LLM inference"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "llama-cpp-python>=0.3",
    "huggingface-hub>=0.30",
    "httpx>=0.28",
    "pydantic>=2.11",
    "pydantic-settings>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1",
    "respx>=0.22",
    "httpx>=0.28",
    "ruff>=0.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 120
