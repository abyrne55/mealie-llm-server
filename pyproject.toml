[project]
name = "mealie-local-ai"
version = "0.1.0"
description = "OpenAI-compatible API gateway for Mealie with local LLM inference"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "llama-cpp-python>=0.3",
    "huggingface-hub>=0.30",
    "httpx>=0.28",
    "pydantic>=2.11",
    "pydantic-settings>=2.9",
    "model2vec>=0.6",
]

[dependency-groups]
train = [
    "torch>=2.6",
    "transformers>=4.48",
    "peft>=0.15",
    "trl>=0.17",
    "datasets>=3.3",
    "accelerate>=1.5",
    "gguf>=0.6",
    "sentencepiece>=0.2",
    "protobuf>=5",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1",
    "respx>=0.22",
    "httpx>=0.28",
    "ruff>=0.11",
    "pre-commit>=4.6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = [
    "unit: fast isolated tests, no external dependencies",
    "component: tests a whole component end-to-end, may load ML models, no external services",
    "e2e: end-to-end tests requiring a running Mealie instance",
]

[tool.ruff]
target-version = "py314"
line-length = 120
