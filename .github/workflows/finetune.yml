name: Fine-tune

on:
  push:
    branches: [main]
    paths:
      - scripts/finetune.py
      - tests/integration/ingredients.csv
  workflow_dispatch:

jobs:
  finetune:
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Cache venv
        uses: actions/cache@v5
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}

      - name: Install dependencies
        run: uv sync --group train

      - name: Fine-tune model
        env:
          PYTORCH_MPS_HIGH_WATERMARK_RATIO: "0.0"
          PYTORCH_ENABLE_MPS_FALLBACK: "1"
        run: uv run python scripts/finetune.py

      - name: Upload GGUF artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuextract-1.5-tiny-finetuned-gguf
          path: models/nuextract-1.5-tiny-finetuned-q8_0.gguf
          retention-days: 90
          if-no-files-found: error
